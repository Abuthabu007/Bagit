services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-migrate:
    image: bagit-db-migrate:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrator
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  catalog:
    image: bagit-catalog:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: catalog
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PGSCHEMA: catalog
      PGHOST: postgres
      PGPORT: "5432"
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-development-service-token-change-me}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  identity:
    image: bagit-identity:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: identity
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PGSCHEMA: identity
      PGHOST: postgres
      PGPORT: "5432"
      DELIVERY_SERVICE_URL: http://delivery:3000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-development-service-token-change-me}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      delivery:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  orders:
    image: bagit-orders:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: orders
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PGSCHEMA: orders
      PGHOST: postgres
      PGPORT: "5432"
      IDENTITY_SERVICE_URL: http://identity:3000
      CATALOG_SERVICE_URL: http://catalog:3000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-development-service-token-change-me}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
      catalog:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  delivery:
    image: bagit-delivery:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: delivery
    restart: unless-stopped
    environment:
      NODE_ENV: development
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      catalog:
        condition: service_healthy
      identity:
        condition: service_healthy
      orders:
        condition: service_healthy
      delivery:
        condition: service_healthy

volumes:
  postgres_data: